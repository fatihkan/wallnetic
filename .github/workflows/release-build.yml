name: Release Build

# The DMG workflow builds Release with Xcode 26.4.1 for each architecture, but it
# only runs for a release tag. That configuration has reported errors the Debug
# CI build did not (#218, #219), so dev runs the same build before tagging (#312).
# Nothing is tagged, packaged or published.
on:
  push:
    branches: [dev]
  # Checks changes to this workflow before they reach dev.
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/release-build.yml
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: Wallnetic
  PROJECT_PATH: src/Wallnetic/Wallnetic.xcodeproj

jobs:
  build:
    name: Release build (${{ matrix.arch_name }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            arch_name: Apple Silicon
          - arch: x86_64
            arch_name: Intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      # Keep in sync with the build step in release.yml.
      - name: Build for ${{ matrix.arch_name }}
        run: |
          xcodebuild -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -arch ${{ matrix.arch }} \
            -derivedDataPath build \
            clean build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # release.yml checks the bundles only after a tag; these checks find an
      # architecture or version mismatch, or a missing privacy manifest, earlier.
      - name: Check the built bundles
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re, subprocess
          from pathlib import Path

          project = Path('src/Wallnetic/project.yml').read_text()
          expected = (re.search(r'MARKETING_VERSION: "([^"]+)"', project).group(1),
                      re.search(r'CURRENT_PROJECT_VERSION: "(\d+)"', project).group(1))
          app = Path('build/Build/Products/Release/Wallnetic.app')
          for bundle in (app, app / 'Contents/PlugIns/WallneticWidget.appex'):
              info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
              actual = (info['CFBundleShortVersionString'], info['CFBundleVersion'])
              if actual != expected:
                  raise SystemExit(f'{bundle.name}: {actual} does not match project.yml {expected}')
              executable = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
              arch = subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip()
              if arch != os.environ['BUILD_ARCH']:
                  raise SystemExit(f'{bundle.name}: unexpected architecture {arch}')
              print(f'{bundle.name}: {actual[0]} ({actual[1]}), {arch}')

          manifest = plistlib.loads((app / 'Contents/Resources/PrivacyInfo.xcprivacy').read_bytes())
          categories = sorted(entry['NSPrivacyAccessedAPIType'] for entry in manifest['NSPrivacyAccessedAPITypes'])
          print('Privacy manifest:', ', '.join(categories))
          PY
