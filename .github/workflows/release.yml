name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to package
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  APP_NAME: Wallnetic
  SCHEME: Wallnetic
  PROJECT_PATH: src/Wallnetic/Wallnetic.xcodeproj
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            arch_name: Apple Silicon
          - arch: x86_64
            arch_name: Intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Verify tag and committed version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Expected a stable vX.Y.Z release tag')
          version = tag[1:]
          project = Path('src/Wallnetic/project.yml').read_text()
          marketing = re.search(r'MARKETING_VERSION: "([^"]+)"', project).group(1)
          build = re.search(r'CURRENT_PROJECT_VERSION: "(\d+)"', project).group(1)
          pbx = Path(os.environ['PROJECT_PATH'], 'project.pbxproj').read_text()
          if (marketing != version
              or set(re.findall(r'MARKETING_VERSION = ([^;]+);', pbx)) != {version}
              or set(re.findall(r'CURRENT_PROJECT_VERSION = ([^;]+);', pbx)) != {build}):
              raise SystemExit('Tag, project.yml and Xcode project versions must match')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'VERSION={version}\nBUILD={build}\n')
          print(f'Packaging committed version {version} ({build})')
          PY

      - name: Build for ${{ matrix.arch_name }}
        run: |
          xcodebuild -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -arch ${{ matrix.arch }} \
            -derivedDataPath build \
            clean build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_BUILD: ${{ steps.version.outputs.BUILD }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/${{ env.APP_NAME }}.app"
          DMG_NAME="${APP_NAME}_${RELEASE_VERSION}_${RELEASE_ARCH}.dmg"

          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path

          app = Path('build/Build/Products/Release', os.environ['APP_NAME'] + '.app')
          for bundle in (app, app / 'Contents/PlugIns/WallneticWidget.appex'):
              info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
              actual = (info['CFBundleShortVersionString'], info['CFBundleVersion'])
              expected = (os.environ['RELEASE_VERSION'], os.environ['RELEASE_BUILD'])
              if actual != expected:
                  raise SystemExit(f'{bundle.name}: {actual} does not match {expected}')
              executable = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
              arch = subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip()
              if arch != os.environ['RELEASE_ARCH']:
                  raise SystemExit(f'{bundle.name}: unexpected architecture {arch}')
              print(f'{bundle.name}: {actual[0]} ({actual[1]}), {arch}')
          PY

          # Remove quarantine and extended attributes to prevent
          # "app is damaged" error on user machines
          xattr -cr "$APP_PATH"

          # Direct downloads use ad-hoc signing; this is not Apple notarization.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          # Create temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/

          # Create symbolic link to Applications folder
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

          hdiutil verify "$DMG_NAME"

          echo "DMG_PATH=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ matrix.arch }}
          path: "*.dmg"
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          record = Path(f'docs/releases/{version}.md').read_text()
          changes = record.split("## What's New — English\n", 1)[1].split('\n## ', 1)[0].strip()
          notes = f"""## Wallnetic {version}

          {changes}

          ## Downloads

          - Apple Silicon: `Wallnetic_{version}_arm64.dmg`
          - Intel: `Wallnetic_{version}_x86_64.dmg`
          - Requires macOS 13 or later.

          Open the DMG and drag Wallnetic to Applications.
          These direct downloads are ad-hoc signed and are not notarized by Apple.
          For installation through Apple, use the [Mac App Store](https://apps.apple.com/app/id6760347328?mt=12).

          `SHA256SUMS.txt` contains checksums for both DMGs. From the download directory,
          run `shasum -a 256 -c SHA256SUMS.txt` after downloading both packages.
          """
          Path('release_notes.md').write_text(notes)
          PYNOTES

      - name: Generate DMG checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/Wallnetic_*/*.dmg release-assets/
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          sha256sum *.dmg > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: true
          prerelease: false
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
            docs/assets/demo-video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
